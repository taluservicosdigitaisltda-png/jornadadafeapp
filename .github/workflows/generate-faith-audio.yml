name: Gerar áudios 5 Minutos de Fé

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar MP3s com Azure Speech
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_VOICE: pt-BR-MacerioMultilingualNeural
        run: python scripts/generate_azure_tts.py

      - name: Salvar áudios no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then
            echo "Nenhum áudio novo para salvar."
            exit 0
          fi
          git commit -m "Gera áudios do 5 Minutos de Fé"
          git push
