name: Gerar áudios 5 Minutos de Fé

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'audio/manifests/*.json'
      - 'scripts/generate_azure_tts.py'
      - '.github/workflows/generate-faith-audio.yml'

permissions:
  contents: write

concurrency:
  group: gerar-audios-5-minutos-de-fe
  cancel-in-progress: true

jobs:
  synthesize:
    name: Gerar lote ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        batch: ['01', '02', '03', '04']
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar MP3s do lote com Azure Speech
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_VOICE: pt-BR-MacerioMultilingualNeural
          MANIFEST_FILE: audio/manifests/batch-${{ matrix.batch }}.json
          OUTPUT_DIR: generated/audio
        run: python scripts/generate_azure_tts.py

      - name: Validar lote
        run: |
          count=$(find generated/audio -maxdepth 1 -type f -name '*.mp3' | wc -l)
          echo "MP3s no lote ${{ matrix.batch }}: $count"
          if [ "$count" -ne 12 ]; then
            echo "Cada lote deve gerar exatamente 12 áudios."
            exit 1
          fi

      - name: Enviar artefato do lote
        uses: actions/upload-artifact@v4
        with:
          name: audio-batch-${{ matrix.batch }}
          path: generated/audio/*.mp3
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Reunir e salvar 48 áudios
    needs: synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar todos os lotes
        uses: actions/download-artifact@v4
        with:
          pattern: audio-batch-*
          merge-multiple: true
          path: public/audio

      - name: Validar 48 MP3s
        run: |
          count=$(find public/audio -maxdepth 1 -type f -name '*.mp3' | wc -l)
          echo "MP3s encontrados: $count"
          if [ "$count" -ne 48 ]; then
            echo "Esperados exatamente 48 áudios."
            exit 1
          fi
          find public/audio -maxdepth 1 -type f -name '*.mp3' -size -1000c -print -quit | grep -q . && {
            echo "Existe pelo menos um MP3 inválido ou pequeno demais."
            exit 1
          } || true

      - name: Salvar áudios no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then
            echo "Nenhum áudio novo para salvar."
            exit 0
          fi
          git commit -m "Gera 48 áudios do 5 Minutos de Fé"
          git push
